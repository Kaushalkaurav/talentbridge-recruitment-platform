name: Import Talent Bridge source
on:
  push:
    branches: [main]
    paths:
      - 'source-bundle.zip.b64'
      - '.github/workflows/import-source.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        run: |
          base64 --decode source-bundle.zip.b64 > /tmp/talentbridge-source.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive=zipfile.ZipFile('/tmp/talentbridge-source.zip')
          for item in archive.infolist():
              path=Path(item.filename)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Unsafe archive path')
          archive.extractall('.')
          print('Extracted', len(archive.namelist()), 'files')
          PY
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tests.yml
          git add -A
          git commit -m "Import Talent Bridge full-stack application files" || exit 0
          git push
