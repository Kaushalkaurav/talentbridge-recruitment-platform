{% extends 'base.html' %}{% block content %}<main class="page" id="main-content"><div class="wrap narrow"><div class="page-hero"><span class="eyebrow">Candidate profile</span><h1>Make your next move count.</h1><p>Complete your profile so you can apply for roles and be considered for relevant opportunities.</p></div><div class="form-card"><h2>{{ 'Update' if profile else 'Complete' }} your profile</h2>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="field-grid"><input type="hidden" name="csrf" value="{{csrf}}"><label>Full name<input value="{{user.name}}" disabled></label><label>Email<input value="{{user.email}}" disabled></label><label>Current location<input name="location" required value="{{profile.location if profile else ''}}"></label><label>Experience<input name="experience" placeholder="e.g. Fresher / 2 years" value="{{profile.experience if profile else ''}}" required></label><label class="full">Skills (comma-separated)<input name="skills" value="{{profile.skills if profile else ''}}" required></label><label class="full">Preferred job role<input name="preferred_role" value="{{profile.preferred_role if profile else ''}}" required></label><label class="full">{{ 'Replace resume (optional)' if profile else 'Upload resume (required)' }} — PDF / DOCX, max 5 MB<input type="file" name="resume" accept=".pdf,.docx" {{ '' if profile else 'required' }}>{% if profile and profile.resume_id %}<a href="/documents/{{profile.resume_id}}">Download your current resume ↗</a>{% endif %}</label><label class="full consent"><input type="checkbox" value="yes" name="consent" required {{ 'checked' if profile and profile.consent else '' }}><span>I consent to Talent Bridge processing my profile and sharing it with relevant employers for recruitment purposes, as explained in the <a href="/privacy">privacy information</a>.</span></label><button type="submit" class="btn btn-teal full">Save candidate profile ↗</button></form></div></div></main>{% endblock %}
